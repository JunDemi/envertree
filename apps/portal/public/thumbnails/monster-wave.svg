<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <pattern id="floor" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#2a2f3a"/><rect width="40" height="40" fill="#262a34"/><rect x="40" y="40" width="40" height="40" fill="#262a34"/>
    </pattern>
    <!-- 상자 캐릭터: 윗면(밝게) + 앞면(어둡게) -->
    <symbol id="grunt" viewBox="0 0 48 80" overflow="visible">
      <ellipse cx="24" cy="74" rx="30" ry="9" fill="#000" opacity=".35"/>
      <rect x="0" y="0" width="48" height="28" fill="#7ce6a3"/><rect x="0" y="28" width="48" height="52" fill="#349b5a"/>
      <rect x="10" y="38" width="7" height="8" fill="#111"/><rect x="31" y="38" width="7" height="8" fill="#111"/>
    </symbol>
  </defs>
  <rect width="640" height="360" fill="url(#floor)"/>
  <rect width="640" height="360" fill="#000" opacity=".15"/>
  <!-- 벽 블록 -->
  <g><rect x="60" y="150" width="80" height="80" fill="#8a96a8"/><rect x="60" y="230" width="80" height="88" fill="#46515f"/></g>
  <g><rect x="500" y="40" width="80" height="80" fill="#8a96a8"/><rect x="500" y="120" width="80" height="88" fill="#46515f"/></g>
  <!-- 몬스터들 -->
  <use href="#grunt" x="190" y="40" width="48" height="80"/>
  <use href="#grunt" x="420" y="210" width="48" height="80"/>
  <g transform="translate(470 60)"><ellipse cx="38" cy="112" rx="48" ry="12" fill="#000" opacity=".35"/><rect width="76" height="44" fill="#c084fc"/><rect y="44" width="76" height="76" fill="#7634ad"/><rect x="16" y="58" width="9" height="10" fill="#111"/><rect x="51" y="58" width="9" height="10" fill="#111"/></g>
  <g transform="translate(150 240)"><ellipse cx="16" cy="54" rx="20" ry="7" fill="#000" opacity=".35"/><rect width="32" height="20" fill="#fcd34d"/><rect y="20" width="32" height="36" fill="#af8e10"/><rect x="7" y="26" width="5" height="5" fill="#111"/><rect x="20" y="26" width="5" height="5" fill="#111"/></g>
  <g transform="translate(560 230)"><ellipse cx="22" cy="74" rx="28" ry="9" fill="#000" opacity=".35"/><polygon points="4,14 12,14 6,-6" fill="#fef3c7"/><polygon points="32,14 40,14 38,-6" fill="#fef3c7"/><rect width="44" height="26" fill="#f37b7b"/><rect y="26" width="44" height="50" fill="#a72f2f"/><rect x="9" y="36" width="6" height="7" fill="#111"/><rect x="29" y="36" width="6" height="7" fill="#111"/></g>
  <!-- 플레이어 + 총알 -->
  <g transform="translate(296 132)">
    <ellipse cx="22" cy="92" rx="30" ry="10" fill="#000" opacity=".4"/>
    <rect x="6" y="0" width="32" height="22" fill="#93c5fd"/><rect x="6" y="22" width="32" height="28" fill="#3d73b8"/>
    <rect x="12" y="32" width="5" height="7" fill="#0f172a"/><rect x="27" y="32" width="5" height="7" fill="#0f172a"/>
    <rect x="0" y="40" width="44" height="22" fill="#76a8f8"/><rect x="0" y="62" width="44" height="30" fill="#2a5aa8"/>
    <rect x="40" y="56" width="34" height="8" fill="#1f2937"/>
  </g>
  <rect x="384" y="186" width="20" height="6" rx="3" fill="#fde68a"/>
  <rect x="424" y="200" width="20" height="6" rx="3" fill="#fde68a"/>
  <text x="320" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#fff" stroke="#0b0d12" stroke-width="6" paint-order="stroke">MONSTER WAVE</text>
</svg>
